<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: #1e1f24; color: #e6e6e6; font: 13px system-ui, sans-serif; }
  p { margin: 0 0 10px; }
  input { width: 100%; height: 32px; padding: 0 10px; border-radius: 6px; border: 0; background: #2a2c33; color: inherit; font: inherit; outline: none; }
  input:focus { box-shadow: 0 0 0 2px #6ea8ff; }
  #err { color: #ff8a80; min-height: 18px; margin: 6px 0; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button { height: 30px; padding: 0 14px; border-radius: 6px; border: 0; background: #3a3d46; color: inherit; font: inherit; cursor: pointer; }
  button.ok { background: #2d5a3a; }
</style>
<p>Contraseña maestra de Bitwarden</p>
<input id="pw" type="password" autofocus autocomplete="off">
<div id="err"></div>
<div class="row"><button id="cancel">Cancelar</button><button id="ok" class="ok">Desbloquear</button></div>
<script>
  const $ = id => document.getElementById(id);
  const submit = () => $('pw').value && api.submit($('pw').value);
  $('ok').onclick = submit;
  $('cancel').onclick = () => api.cancel();
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') api.cancel(); });
  api.onError(m => { $('err').textContent = m; $('pw').select(); });
</script>
